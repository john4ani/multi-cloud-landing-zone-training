<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Multi-cloud delivery and Terraform state control plane</title>
  <desc id="desc">An engineer submits a reviewed change to a private GitHub repository. GitHub Actions validates code, creates Terraform plans with read-oriented cloud identities, evaluates policy, and waits for protected-environment approval. Separate apply identities deploy the exact reviewed plans to Azure and AWS. Azure Blob Storage and Amazon S3 store separate encrypted and locked Terraform state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d76b00"/></marker>
    <style>
      .title{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#172033}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#526173}.label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#172033}.small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#526173}.group-label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#172033}
      .resource{fill:#fff;stroke:#aab3bf;stroke-width:1.5}.github{fill:#f7f7f8;stroke:#4b5563;stroke-width:1.8}.azure{fill:#f7fbff;stroke:#0078d4;stroke-width:2}.aws{fill:#fffaf3;stroke:#d76b00;stroke-width:2}.gate{fill:#fff9e8;stroke:#b7791f;stroke-width:1.8}.flow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.oidc{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.azflow{fill:none;stroke:#0078d4;stroke-width:2.2;marker-end:url(#arrow-blue)}.awsflow{fill:none;stroke:#d76b00;stroke-width:2.2;marker-end:url(#arrow-orange)}
    </style>
  </defs>

  <rect width="1600" height="930" fill="#fff"/>
  <text x="60" y="54" class="title">Multi-cloud delivery and Terraform state control plane</text>
  <text x="60" y="82" class="subtitle">Azure and AWS implemented - OIDC federation, exact plans, protected approval, and separate state</text>

  <circle cx="90" cy="300" r="36" fill="#e8eef5" stroke="#6b7b8d" stroke-width="1.5"/>
  <circle cx="90" cy="287" r="10" fill="#526173"/>
  <path d="M70 318 Q90 300 110 318" fill="none" stroke="#526173" stroke-width="7" stroke-linecap="round"/>
  <text x="90" y="354" text-anchor="middle" class="label">Engineer</text>

  <g transform="translate(175 218)">
    <rect width="190" height="164" rx="9" class="github"/>
    <circle cx="95" cy="49" r="27" fill="#24292f"/>
    <path d="M79 49 l11 11 21 -25" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="96" text-anchor="middle" class="label">Private GitHub repository</text>
    <text x="95" y="118" text-anchor="middle" class="small">Protected branches</text>
    <text x="95" y="138" text-anchor="middle" class="small">Required review ownership</text>
  </g>
  <path d="M126 300 H175" class="flow"/>
  <text x="150" y="285" text-anchor="middle" class="small">PR</text>

  <rect x="410" y="135" width="390" height="330" rx="10" class="github"/>
  <text x="435" y="166" class="group-label">GitHub Actions — pull request and plan</text>
  <g transform="translate(450 195)">
    <rect width="140" height="100" rx="8" class="resource"/>
    <text x="70" y="38" text-anchor="middle" class="label">Build + test</text>
    <text x="70" y="61" text-anchor="middle" class="small">Angular · .NET</text>
    <text x="70" y="80" text-anchor="middle" class="small">Docs · accessibility</text>
  </g>
  <g transform="translate(620 195)">
    <rect width="140" height="100" rx="8" class="resource"/>
    <text x="70" y="38" text-anchor="middle" class="label">Security scan</text>
    <text x="70" y="61" text-anchor="middle" class="small">Secrets · dependencies</text>
    <text x="70" y="80" text-anchor="middle" class="small">Containers · Terraform</text>
  </g>
  <g transform="translate(450 325)">
    <rect width="140" height="100" rx="8" class="resource"/>
    <text x="70" y="38" text-anchor="middle" class="label">Terraform plan</text>
    <text x="70" y="61" text-anchor="middle" class="small">Read-oriented identity</text>
    <text x="70" y="80" text-anchor="middle" class="small">Plan JSON</text>
  </g>
  <g transform="translate(620 325)">
    <rect width="140" height="100" rx="8" class="resource"/>
    <text x="70" y="38" text-anchor="middle" class="label">OPA/Rego gate</text>
    <text x="70" y="61" text-anchor="middle" class="small">Security · cost · policy</text>
    <text x="70" y="80" text-anchor="middle" class="small">Reviewed plan checksum</text>
  </g>
  <path d="M365 300 H410" class="flow"/>
  <path d="M590 245 H620" class="flow"/>
  <path d="M690 295 V325" class="flow"/>
  <path d="M620 375 H590" class="flow"/>

  <g transform="translate(840 235)">
    <rect width="190" height="130" rx="10" class="gate"/>
    <path d="M75 32 h40 v42 h-40 z M84 32 v-10 q0-18 11-18 q11 0 11 18 v10" fill="none" stroke="#9a681b" stroke-width="4"/>
    <text x="95" y="91" text-anchor="middle" class="label">Protected environment</text>
    <text x="95" y="112" text-anchor="middle" class="small">Human approval gate</text>
  </g>
  <path d="M800 300 H840" class="flow"/>

  <rect x="1080" y="118" width="450" height="320" rx="10" class="azure"/>
  <text x="1105" y="150" class="group-label" style="fill:#005a9e">Azure deployment lane - implemented</text>
  <g transform="translate(1115 180)">
    <rect width="165" height="110" rx="8" class="resource"/>
    <image href="icons/azure/entra-id.svg" x="57" y="10" width="50" height="50"/>
    <text x="82" y="81" text-anchor="middle" class="label">Azure apply identity</text>
    <text x="82" y="100" text-anchor="middle" class="small">OIDC federated</text>
  </g>
  <g transform="translate(1330 180)">
    <rect width="165" height="110" rx="8" class="resource"/>
    <text x="82" y="31" text-anchor="middle" class="label">Azure workload</text>
    <text x="82" y="53" text-anchor="middle" class="small">Exact plan + image digest</text>
    <text x="82" y="74" text-anchor="middle" class="small">SQL migration + Angular</text>
    <text x="82" y="95" text-anchor="middle" class="small">CRUD smoke + token revoke</text>
  </g>
  <g transform="translate(1220 315)">
    <rect width="190" height="96" rx="8" class="resource"/>
    <image href="icons/azure/storage-account.svg" x="18" y="18" width="48" height="48"/>
    <text x="120" y="37" text-anchor="middle" class="label">Azure Blob state</text>
    <text x="120" y="58" text-anchor="middle" class="small">Encrypted · versioned</text>
    <text x="120" y="77" text-anchor="middle" class="small">Native lease locking</text>
  </g>
  <path d="M1030 270 H1115" class="oidc"/>
  <text x="1070" y="255" text-anchor="middle" class="small">OIDC</text>
  <path d="M1280 235 H1330" class="azflow"/>
  <path d="M1197 290 V338 H1220" class="azflow"/>
  <path d="M1412 290 V338 H1410" class="azflow"/>

  <rect x="1080" y="490" width="450" height="320" rx="10" class="aws"/>
  <text x="1105" y="522" class="group-label" style="fill:#9a4d00">AWS deployment lane - implemented</text>
  <g transform="translate(1115 550)">
    <rect width="165" height="110" rx="8" class="resource"/>
    <image href="icons/aws/iam.svg" x="57" y="10" width="50" height="50"/>
    <text x="82" y="81" text-anchor="middle" class="label">AWS apply role</text>
    <text x="82" y="100" text-anchor="middle" class="small">OIDC assumed</text>
  </g>
  <g transform="translate(1330 550)">
    <rect width="165" height="110" rx="8" class="resource"/>
    <text x="82" y="42" text-anchor="middle" class="label">AWS workload</text>
    <text x="82" y="65" text-anchor="middle" class="small">Exact reviewed plan</text>
    <text x="82" y="86" text-anchor="middle" class="small">Deploy · test · destroy</text>
  </g>
  <g transform="translate(1220 685)">
    <rect width="190" height="96" rx="8" class="resource"/>
    <image href="icons/aws/s3.svg" x="18" y="18" width="48" height="48"/>
    <text x="120" y="37" text-anchor="middle" class="label">Amazon S3 state</text>
    <text x="120" y="58" text-anchor="middle" class="small">Encrypted · versioned</text>
    <text x="120" y="77" text-anchor="middle" class="small">Native lock file</text>
  </g>
  <path d="M935 365 V605 H1115" class="oidc"/>
  <text x="1030" y="590" text-anchor="middle" class="small">OIDC</text>
  <path d="M1280 605 H1330" class="awsflow"/>
  <path d="M1197 660 V708 H1220" class="awsflow"/>
  <path d="M1412 660 V708 H1410" class="awsflow"/>

  <rect x="410" y="515" width="390" height="210" rx="10" class="resource"/>
  <text x="435" y="548" class="group-label">Control invariants</text>
  <text x="445" y="583" class="label">✓ Separate plan, apply, and runtime identities</text>
  <text x="445" y="617" class="label">✓ State separated by cloud, environment, and stack</text>
  <text x="445" y="651" class="label">✓ No long-lived Azure or AWS credentials</text>
  <text x="445" y="685" class="label">✓ Apply consumes the reviewed plan checksum</text>

  <text x="60" y="885" class="small">Solid lines: workflow or state access. Dashed lines: short-lived OIDC federation. Backend bootstrap is a documented one-time privileged operation.</text>
</svg>
