<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Azure low-cost landing-zone deployment</title>
  <desc id="desc">The browser authenticates with Microsoft Entra ID using Authorization Code with PKCE, reaches Angular on Azure Static Web Apps, and calls an ASP.NET Core API on Azure Container Apps using a bearer token. The API accesses Azure SQL Database through selected network firewall rules using managed identity. Azure Policy, budgets, monitoring, and an optional enterprise private-networking extension surround the workload.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/>
    </marker>
    <style>
      .title{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#172033}.subtitle{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#526173}
      .group{fill:#f7fbff;stroke:#0078d4;stroke-width:2}.resource{fill:#ffffff;stroke:#9fb8cf;stroke-width:1.5}.optional{fill:#fafafa;stroke:#8793a1;stroke-width:1.5;stroke-dasharray:8 6}
      .group-label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#005a9e}.label{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#172033}.small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#526173}.flow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.identity{fill:none;stroke:#0078d4;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow-blue)}
    </style>
  </defs>

  <rect width="1600" height="940" fill="#ffffff"/>
  <text x="60" y="54" class="title">Azure deployment — accepted low-cost profile</text>
  <text x="60" y="82" class="subtitle">Workload-focused landing zone with enterprise extension points</text>

  <rect x="245" y="112" width="1295" height="710" rx="10" class="group"/>
  <text x="270" y="142" class="group-label">Azure application landing-zone subscription</text>

  <rect x="350" y="204" width="820" height="430" rx="10" class="group"/>
  <text x="375" y="234" class="group-label">Workload resource group</text>

  <rect x="1210" y="204" width="285" height="430" rx="10" class="optional"/>
  <text x="1232" y="234" class="group-label">Enterprise extension</text>
  <text x="1232" y="256" class="small">Disabled in training profile</text>

  <circle cx="100" cy="370" r="38" fill="#e8eef5" stroke="#6b7b8d" stroke-width="1.5"/>
  <circle cx="100" cy="356" r="11" fill="#526173"/>
  <path d="M78 389 Q100 369 122 389" fill="none" stroke="#526173" stroke-width="7" stroke-linecap="round"/>
  <text x="100" y="428" text-anchor="middle" class="label">Browser user</text>

  <g transform="translate(58 168)">
    <rect width="170" height="112" rx="8" class="resource"/>
    <image href="icons/azure/entra-id.svg" x="59" y="12" width="52" height="52"/>
    <text x="85" y="84" text-anchor="middle" class="label">Microsoft Entra ID</text>
    <text x="85" y="103" text-anchor="middle" class="small">OIDC identity provider</text>
  </g>
  <path d="M92 332 V280" class="identity"/>
  <path d="M116 280 V332" class="identity"/>
  <text x="128" y="310" class="small">Code + PKCE</text>
  <path d="M228 218 H320 V260 H630 V270 H760 V285" class="identity"/>
  <text x="485" y="252" text-anchor="middle" class="small">Issuer, audience, roles and signing keys</text>

  <rect x="64" y="650" width="165" height="104" rx="8" class="resource"/>
  <path d="M95 689 l16 -13 m-16 13 l16 13 M141 676 l16 13 -16 13" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="724" text-anchor="middle" class="label">CI/CD pipeline</text>
  <text x="146" y="744" text-anchor="middle" class="small">OIDC federation</text>

  <path d="M138 370 H430" class="flow"/>
  <text x="278" y="354" text-anchor="middle" class="small">HTTPS 443</text>

  <path d="M570 365 H690" class="flow"/>
  <text x="630" y="348" text-anchor="middle" class="small">HTTPS /api</text>
  <path d="M830 365 H950" class="flow"/>
  <text x="890" y="348" text-anchor="middle" class="small">TLS + explicit egress IPs</text>

  <path d="M229 700 H300 V172 H520" class="flow"/>
  <text x="313" y="190" class="small">Terraform + application deployment</text>

  <g transform="translate(430 285)">
    <rect width="140" height="160" rx="8" class="resource"/>
    <image href="icons/azure/static-web-apps.svg" x="42" y="20" width="56" height="56"/>
    <text x="70" y="99" text-anchor="middle" class="label">Static Web Apps</text>
    <text x="70" y="120" text-anchor="middle" class="small">Angular</text>
    <text x="70" y="140" text-anchor="middle" class="small">Free tier</text>
  </g>

  <g transform="translate(690 285)">
    <rect width="140" height="160" rx="8" class="resource"/>
    <image href="icons/azure/container-apps.svg" x="42" y="20" width="56" height="56"/>
    <text x="70" y="99" text-anchor="middle" class="label">Container Apps</text>
    <text x="70" y="120" text-anchor="middle" class="small">ASP.NET Core API</text>
    <text x="70" y="140" text-anchor="middle" class="small">Consumption</text>
  </g>

  <g transform="translate(950 285)">
    <rect width="140" height="160" rx="8" class="resource"/>
    <image href="icons/azure/sql-database.svg" x="42" y="20" width="56" height="56"/>
    <text x="70" y="99" text-anchor="middle" class="label">Azure SQL</text>
    <text x="70" y="118" text-anchor="middle" class="small">Free serverless offer</text>
    <text x="70" y="138" text-anchor="middle" class="small">Selected networks</text>
  </g>

  <g transform="translate(430 490)">
    <rect width="140" height="112" rx="8" class="resource"/>
    <image href="icons/azure/managed-identity.svg" x="48" y="13" width="44" height="44"/>
    <text x="70" y="79" text-anchor="middle" class="label">Managed identity</text>
    <text x="70" y="98" text-anchor="middle" class="small">No stored secrets</text>
  </g>
  <path d="M570 546 H650 V430 H690" class="identity"/>
  <path d="M570 566 H910 V430 H950" class="identity"/>

  <g transform="translate(675 490)">
    <rect width="140" height="112" rx="8" class="resource"/>
    <image href="icons/azure/monitor.svg" x="48" y="13" width="44" height="44"/>
    <text x="70" y="79" text-anchor="middle" class="label">Azure Monitor</text>
    <text x="70" y="98" text-anchor="middle" class="small">Free allowance</text>
  </g>
  <path d="M760 445 V490" class="identity"/>

  <g transform="translate(365 675)">
    <rect width="170" height="110" rx="8" class="resource"/>
    <image href="icons/azure/policy.svg" x="59" y="12" width="52" height="52"/>
    <text x="85" y="85" text-anchor="middle" class="label">Azure Policy</text>
    <text x="85" y="103" text-anchor="middle" class="small">Guardrails</text>
  </g>
  <g transform="translate(565 675)">
    <rect width="170" height="110" rx="8" class="resource"/>
    <image href="icons/azure/budget.svg" x="59" y="12" width="52" height="52"/>
    <text x="85" y="85" text-anchor="middle" class="label">Budget + alerts</text>
    <text x="85" y="103" text-anchor="middle" class="small">Cost guardrail</text>
  </g>
  <path d="M450 675 V640 H620" class="identity"/>
  <path d="M650 675 V640 H780" class="identity"/>

  <g transform="translate(1260 300)">
    <rect width="185" height="90" rx="8" class="optional"/>
    <text x="92" y="37" text-anchor="middle" class="label">Virtual network</text>
    <text x="92" y="59" text-anchor="middle" class="small">Hub or workload VNet</text>
  </g>
  <g transform="translate(1260 430)">
    <rect width="185" height="90" rx="8" class="optional"/>
    <text x="92" y="37" text-anchor="middle" class="label">Private endpoints</text>
    <text x="92" y="59" text-anchor="middle" class="small">Private DNS</text>
  </g>
  <path d="M1352 390 V430" class="identity"/>
  <path d="M1090 365 H1180 V475 H1260" class="identity"/>
  <text x="1182" y="459" text-anchor="end" class="small">Upgrade path</text>

  <rect x="245" y="854" width="20" height="3" fill="#334155"/>
  <text x="276" y="861" class="small">Runtime or deployment flow</text>
  <line x1="470" y1="856" x2="500" y2="856" stroke="#0078d4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="512" y="861" class="small">Identity, governance, or optional extension</text>
  <text x="60" y="910" class="small">Free tiers are usage-limited. Budgets alert but do not guarantee a spending cap.</text>
  <text x="790" y="910" class="small">The broad “Allow Azure services” SQL firewall rule is prohibited.</text>
</svg>
