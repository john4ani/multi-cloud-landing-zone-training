name: AWS Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY-AWS
        required: true

permissions:
  contents: read

concurrency:
  group: aws-training-delivery
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY-AWS'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-training
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_deploy_workload: 'true'
      TF_VAR_authentication_enabled: ${{ vars.AWS_AUTHENTICATION_ENABLED || 'false' }}
      TF_VAR_database_admin_password: ${{ secrets.AWS_DATABASE_ADMIN_PASSWORD }}
      TF_VAR_expires_at: 2099-12-31
      TF_VAR_lambda_package_path: ${{ github.workspace }}/artifacts/aws/cloud-architecture-training-api.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Rebuild the configuration package required by Terraform
        shell: pwsh
        run: ./scripts/build-aws-package.ps1
      - uses: aws-actions/configure-aws-credentials@11b1c58b24724e66aa52a847862a0c1b0c4b0c7b # v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: aws-destroy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.4
      - name: Create, verify, and apply an exact destroy plan
        working-directory: infrastructure/environments/aws-training
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.AWS_TFSTATE_BUCKET }}" \
            -backend-config="key=cloud-architecture-training/aws/training/platform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -destroy -input=false -out=destroy.tfplan
          terraform show -no-color destroy.tfplan
          sha256sum destroy.tfplan > destroy.tfplan.sha256
          sha256sum --check destroy.tfplan.sha256
          terraform apply -input=false -auto-approve destroy.tfplan
      - name: Verify tagged workload resources are gone
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            remaining="$(aws resourcegroupstaggingapi get-resources \
              --tag-filters Key=application,Values=cloud-architecture-training Key=environment,Values=training \
              --query 'length(ResourceTagMappingList)' \
              --output text)"
            if [[ "$remaining" == '0' ]]; then
              exit 0
            fi
            echo "$remaining tagged workload resources remain (attempt $attempt/12)."
            sleep 10
          done
          exit 1
