name: AWS Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-AWS
        required: true
      expires_at:
        description: Destruction/review date (YYYY-MM-DD)
        required: true
      alert_email:
        description: Optional budget and alarm email
        required: false

permissions:
  contents: read

concurrency:
  group: aws-training-delivery
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-AWS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: application/web-angular/.nvmrc
          cache: npm
          cache-dependency-path: application/web-angular/package-lock.json
      - name: Test and build the exact commit
        shell: bash
        run: |
          set -euo pipefail
          dotnet format application/backend/CloudArchitectureTraining.slnx --verify-no-changes
          dotnet test application/backend/CloudArchitectureTraining.slnx --configuration Release
          npm ci --prefix application/web-angular
          npm test --prefix application/web-angular -- --watch=false
          npm run build --prefix application/web-angular
      - name: Build the immutable Lambda package
        shell: pwsh
        run: ./scripts/build-aws-package.ps1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-lambda-${{ github.sha }}
          path: artifacts/aws/cloud-architecture-training-api.zip
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-frontend-${{ github.sha }}
          path: application/web-angular/dist/web-angular/browser
          retention-days: 1
          if-no-files-found: error

  plan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-training-plan
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_deploy_workload: 'true'
      TF_VAR_authentication_enabled: ${{ vars.AWS_AUTHENTICATION_ENABLED || 'false' }}
      TF_VAR_database_admin_password: ${{ secrets.AWS_DATABASE_ADMIN_PASSWORD }}
      TF_VAR_expires_at: ${{ inputs.expires_at }}
      TF_VAR_owner: ${{ github.actor }}
      TF_VAR_lambda_package_path: ${{ github.workspace }}/artifacts/aws/cloud-architecture-training-api.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-lambda-${{ github.sha }}
          path: artifacts/aws
      - uses: aws-actions/configure-aws-credentials@11b1c58b24724e66aa52a847862a0c1b0c4b0c7b # v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: aws-protected-plan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.4
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.7.1
      - name: Create the reviewed plan
        working-directory: infrastructure/environments/aws-training
        shell: bash
        env:
          ALERT_EMAIL: ${{ inputs.alert_email }}
        run: |
          set -euo pipefail
          export TF_VAR_alert_contact_emails="$(jq -cn --arg email "$ALERT_EMAIL" 'if $email == "" then [] else [$email] end')"
          terraform init -input=false \
            -backend-config="bucket=${{ vars.AWS_TFSTATE_BUCKET }}" \
            -backend-config="key=cloud-architecture-training/aws/training/platform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -lock=false -out=tfplan
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > plan-summary.txt
          opa eval --data "${GITHUB_WORKSPACE}/policies/rego" --input tfplan.json --format pretty 'data.terraform.security.deny' > policy-result.txt
          opa eval --fail --data "${GITHUB_WORKSPACE}/policies/rego" --input tfplan.json 'count(data.terraform.security.deny) == 0'
          sha256sum tfplan > tfplan.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-reviewed-plan-${{ github.run_id }}
          path: |
            infrastructure/environments/aws-training/tfplan
            infrastructure/environments/aws-training/tfplan.sha256
            infrastructure/environments/aws-training/plan-summary.txt
            infrastructure/environments/aws-training/policy-result.txt
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: [build, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-training
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@11b1c58b24724e66aa52a847862a0c1b0c4b0c7b # v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: aws-apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-reviewed-plan-${{ github.run_id }}
          path: infrastructure/environments/aws-training
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-lambda-${{ github.sha }}
          path: artifacts/aws
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-frontend-${{ github.sha }}
          path: frontend
      - name: Verify and apply the exact plan
        working-directory: infrastructure/environments/aws-training
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.AWS_TFSTATE_BUCKET }}" \
            -backend-config="key=cloud-architecture-training/aws/training/platform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          sha256sum --check tfplan.sha256
          terraform apply -input=false -auto-approve tfplan
          terraform output -json deployment > "${RUNNER_TEMP}/deployment.json"
      - name: Apply database migrations
        shell: pwsh
        env:
          AWS_DATABASE_ADMIN_PASSWORD: ${{ secrets.AWS_DATABASE_ADMIN_PASSWORD }}
        run: |
          $deployment = Get-Content "$env:RUNNER_TEMP/deployment.json" | ConvertFrom-Json
          ./scripts/migrate-aws.ps1 -FunctionName $deployment.migration_function_name
      - name: Configure and publish Angular
        shell: pwsh
        run: |
          $deployment = Get-Content "$env:RUNNER_TEMP/deployment.json" | ConvertFrom-Json
          $browserConfig = @{
            apiBaseUrl = '/api'
            authentication = @{
              enabled = [bool]$deployment.authentication_enabled
              provider = $deployment.authentication_provider
              authority = $deployment.authentication_authority
              clientId = $deployment.user_pool_client_id
              scope = $deployment.authentication_scope
            }
          }
          "globalThis.cloudTrainingConfig = $($browserConfig | ConvertTo-Json -Depth 3 -Compress);" |
            Set-Content frontend/config.js -Encoding utf8NoBOM
          aws s3 sync frontend "s3://$($deployment.frontend_bucket_name)" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id $deployment.cloudfront_distribution_id --paths '/*' | Out-Null
      - name: Smoke test the deployed system
        shell: pwsh
        env:
          AUTHENTICATION_TEST_ACCESS_TOKEN: ${{ secrets.AWS_AUTHENTICATION_TEST_ACCESS_TOKEN }}
        run: |
          $deployment = Get-Content "$env:RUNNER_TEMP/deployment.json" | ConvertFrom-Json
          ./scripts/smoke-test.ps1 `
            -ApiBaseUrl $deployment.api_base_url `
            -FrontendUrl $deployment.frontend_url `
            -Cloud AWS `
            -AccessToken $env:AUTHENTICATION_TEST_ACCESS_TOKEN
