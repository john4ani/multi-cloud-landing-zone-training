name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: application/web-angular/.nvmrc
          cache: npm
          cache-dependency-path: application/web-angular/package-lock.json
      - name: Test backend
        run: |
          dotnet format application/backend/CloudArchitectureTraining.slnx --verify-no-changes
          dotnet test application/backend/CloudArchitectureTraining.slnx --configuration Release
      - name: Verify provider-specific migrations
        working-directory: application/backend
        run: |
          dotnet tool restore
          Database__Provider=PostgreSql dotnet ef migrations script --idempotent --project migrations/CloudArchitectureTraining.Migrations.PostgreSql --startup-project src/CloudArchitectureTraining.Api --output "${RUNNER_TEMP}/postgresql.sql"
          Database__Provider=SqlServer dotnet ef migrations script --idempotent --project migrations/CloudArchitectureTraining.Migrations.SqlServer --startup-project src/CloudArchitectureTraining.Api --output "${RUNNER_TEMP}/sqlserver.sql"
      - name: Test and build frontend
        working-directory: application/web-angular
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

  infrastructure-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.4
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.7.1
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Validate Terraform roots
        shell: pwsh
        run: |
          $roots = @(
            'infrastructure/bootstrap/azure',
            'infrastructure/environments/azure-training',
            'infrastructure/bootstrap/aws',
            'infrastructure/environments/aws-training'
          )
          foreach ($root in $roots) {
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
          }
      - name: Test Rego policies
        working-directory: policies
        run: opa test rego tests --verbose
      - name: Check workflow security
        shell: pwsh
        run: ./scripts/validate-workflows.ps1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
